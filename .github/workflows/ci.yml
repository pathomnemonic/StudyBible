name: CI

# Keep stale PR commits from occupying browser/sweep runners after a newer push.
concurrency:
  group: studybible-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
  pull_request:
jobs:
  # fast: runs on every push
  fast:
    runs-on: ubuntu-latest
    # Only this job needs to commit regenerated, deterministic reference indexes to the PR branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Regenerate exact-reference indexes and their offline manifest
        run: |
          npx tsx scripts/launch/make-lesson-links.ts
          npx tsx scripts/launch/make-verse-links.ts
          npx tsx -e "import { buildManifest } from './scripts/ingest/manifest'; buildManifest()"
      - name: Upload regenerated reference indexes for review
        uses: actions/upload-artifact@v4
        with:
          name: exact-reference-indexes
          path: |
            public/data/curriculum/lesson-chapters.json
            public/data/verse-links/*.json
            public/data/manifest.json
          if-no-files-found: error
      - name: Commit regenerated exact-reference data to this PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'reliability/reference-listening-state-cycle'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/curriculum/lesson-chapters.json public/data/verse-links public/data/manifest.json
          if git diff --cached --quiet; then
            echo "Generated reference data is already current."
          else
            git commit -m "Regenerate exact-only reference indexes"
            git push origin HEAD:refs/heads/reliability/reference-listening-state-cycle || echo '::warning::GitHub Actions token cannot push generated data; download the exact-reference-indexes artifact and commit it with write access.'
          fi
      - run: npm test
      - name: Generated documents are up to date
        run: |
          npm run docs:status
          git diff --exit-code docs/FEATURE_STATUS.md
      - name: Data validation
        run: npm run data:validate
      - run: npm run build
      - name: Size budgets
        run: npm run budget
      # high and critical findings fail the build unless docs/AUDIT_EXCEPTIONS.json holds an unexpired waiver (owner, reason, date);
      # the output says PASS, WAIVED or FAIL for each package
      - name: Dependency vulnerabilities (production)
        run: node scripts/audit-gate.mjs
  # comprehensive: real browser, offline reload, accessibility in every theme
  browser:
    # pinned: ubuntu-latest moved to 26.04, which this Playwright version cannot install a browser on
    runs-on: ubuntu-24.04
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3'] # the 21 checks split across three runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Serve the build
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
      # Deep Waters-specific gameplay, persistence, spelling suggestion and hidden-tab timer regressions.
      - run: node e2e/deepwaters.mjs
      # smoke, routes, the study and data workflows through the interface, parallel reader, offline (a real dead server), stale scripts, accessibility at every level
      - run: npm run e2e:release
        env:
          SHARD: ${{ matrix.shard }}
  # accounts and sync in a real browser against the real server (a build with accounts switched on, a throwaway database, no live credentials)
  accounts:
    runs-on: ubuntu-24.04
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: VITE_ACCOUNTS=1 npx vite build --outDir dist-accounts
      - run: npx playwright install --with-deps chromium
      - name: Start the sync server on a temporary database
        run: |
          STATIC_DIR=dist-accounts PORT=8799 COOKIE_SECURE=false REGISTRATION=open DB_PATH=/tmp/acct-e2e.sqlite npx tsx server/index.ts &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/api/health >/dev/null && break; sleep 1; done
      - run: BASE=http://127.0.0.1:8799 node e2e/accounts.mjs
      # two devices on one account: unsent markers, pull, deletion with tombstone and undo copy, in a real browser's IndexedDB
      - run: BASE=http://127.0.0.1:8799 node e2e/sync-devices.mjs
  # full-width sweep: every route at phone, tablet, desktop and large-text sizes
  sweep-full:
    runs-on: ubuntu-24.04
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Serve the build
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
      - name: Full-width and large-text sweep
        run: SWEEP_MODE=full node e2e/sweep.mjs
  # secrets: scan the history for accidentally committed credentials
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
