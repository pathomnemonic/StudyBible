name: CI
on:
  push:
  pull_request:
jobs:
  # fast: runs on every push
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Generated documents are up to date
        run: |
          npm run docs:status
          git diff --exit-code docs/FEATURE_STATUS.md
      - name: Data validation
        run: npm run data:validate
      - run: npm run build
      - name: Size budgets
        run: npm run budget
      - name: Dependency vulnerabilities (production)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
  # comprehensive: real browser, offline reload, accessibility in every theme
  browser:
    # pinned: ubuntu-latest moved to 26.04, which this Playwright version cannot install a browser on
    runs-on: ubuntu-24.04
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3'] # the 21 checks split across three runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Serve the build
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
      # smoke, routes, the study and data workflows through the interface, parallel reader, offline (a real dead server), stale scripts, accessibility at every level
      - run: npm run e2e:release
        env:
          SHARD: ${{ matrix.shard }}
  # secrets: scan the history for accidentally committed credentials
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
