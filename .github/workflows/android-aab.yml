name: Android AAB (Play upload copy)

# Builds the same release bundle as the Codemagic android-release workflow, but leaves it
# UNSIGNED and stores it as a workflow artifact. Orion downloads the artifact, signs it with
# the app upload key (jarsigner, same as the Codemagic step), and uploads it to Play Console.
# Exists because Codemagic build artifacts cannot be handed to the Play Console browser flow.
# Manual trigger only. Added by Orion, Nov 25, 2026.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install web dependencies
        run: npm ci
      - name: Build the web app
        env:
          VITE_LOCAL_ONLY: "1"
        run: npm run build
      - name: Create the Android project if needed and sync
        run: |
          npm install --no-save @capacitor/android@^7.6.10
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Leave the downloadable packs out of the Android bundle
        run: python3 tools/native_slim.py android/app/src/main/assets/public
      - name: Raise the minimum SDK to 24 (Play automatic protection requires it)
        run: |
          sed -i "s/minSdkVersion = 23/minSdkVersion = 24/" android/variables.gradle
          grep -n "minSdkVersion" android/variables.gradle
      - name: Set the version code
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Build the Android app bundle (unsigned)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
