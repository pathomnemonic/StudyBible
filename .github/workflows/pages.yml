name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master, ccr-c086ddeb-igsukm]
  workflow_dispatch:
  schedule:
    - cron: '40 9 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the USCCB daily-readings feed (shown as published; keeps the committed copy if the fetch fails)
        run: curl -fsS --max-time 30 https://bible.usccb.org/readings.rss -o /tmp/feed.xml && grep -q '<item>' /tmp/feed.xml && cp /tmp/feed.xml public/data/usccb/feed.xml || echo 'feed fetch failed; using committed copy'
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
